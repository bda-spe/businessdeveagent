name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: artifacts/bda
        env:
          # Custom domain serves from the root, not a /reponame/ subpath.
          BASE_PATH: /
          PORT: "5173"
          # Points the deployed frontend at the Render backend, now on the
          # same registrable domain (businessdevagent.com) so the session
          # cookie is same-site instead of third-party.
          VITE_API_BASE_URL: https://api.businessdevagent.com
        run: pnpm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/bda/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
