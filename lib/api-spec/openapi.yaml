      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WidgetInteractInput"
      responses:
        "200":
          description: AI response and generated estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetInteractResult"

  /widget-test/config:
    get:
      operationId: getWidgetTestConfig
      tags: [widget]
      summary: Authenticated widget config for the dashboard's live test mode
      responses:
        "200":
          description: Widget config for the authenticated business, always enabled for testing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetConfig"

  /widget-test/questions:
    post:
      operationId: widgetTestQuestions
      tags: [widget]
