      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WidgetQuestionsInput"
      responses:
        "200":
          description: Industry-specific follow-up questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetQuestionsResult"

  /widget/interact:
    post:
      operationId: widgetInteract
      tags: [widget]
