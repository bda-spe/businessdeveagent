          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetInteractResult"

  /billing/plans:
    get:
      operationId: listBillingPlans
      tags: [billing]
      summary: List available billing plans
      responses:
        "200":
          description: Billing plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BillingPlan"

  /billing/subscription:
    get:
      operationId: getSubscription
      tags: [billing]
      summary: Get current subscription
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSubscription"

  /billing/checkout:
    post:
      operationId: checkout
      tags: [billing]
      summary: Create a Stripe Embedded Checkout session for the selected plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "200":
