openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Business Development Agent (BDA) multi-tenant SaaS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: account
    description: Current user and business
  - name: services
    description: Business services catalog
  - name: pricing
    description: Pricing rules
  - name: requirements
    description: Onboarding requirements checklist
  - name: files
    description: Uploaded documents and images
  - name: extracted
    description: AI-extracted requirement values
  - name: sandbox
    description: Sandbox training tests
  - name: profileInterview
    description: AI-guided business profile interview
  - name: leads
    description: Lead inbox
  - name: widget
    description: Public embeddable widget
  - name: billing
    description: Subscription billing
  - name: dashboard
    description: Dashboard summaries and activity
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs. These can optionally
        be protected with authentication or ACL checks based on the use case.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /me:
    get:
      operationId: getMe
      tags: [account]
      summary: Get current user and their business
      responses:
        "200":
          description: Current account context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /onboarding/business:
    post:
      operationId: createBusiness
      tags: [account]
      summary: Create the business during onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessCreateInput"
      responses:
        "201":
          description: Business created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"

  /business:
    get:
      operationId: getBusiness
      tags: [account]
      summary: Get the current business profile
      responses:
        "200":
          description: Business profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
    patch:
      operationId: updateBusiness
      tags: [account]
      summary: Update the business info
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessUpdate"
      responses:
        "200":
          description: Updated business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"

  /business/email:
    patch:
      operationId: updateBusinessEmail
      tags: [account]
      summary: Update the email address associated with the account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBusinessEmailInput"
      responses:
        "200":
          description: Updated business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"

  /account:
    delete:
      operationId: deleteAccount
      tags: [account]
      summary: Permanently delete the account and all associated data. Any active subscription is scheduled to cancel at period end before data is wiped.
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean

  /business/approve:
    post:
      operationId: approveBusinessProfile
      tags: [account]
      summary: Approve the business profile after requirement review
      responses:
        "200":
          description: Approved business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"

  /business/industries:
    get:
      operationId: listBusinessIndustries
      tags: [account]
      summary: List all selected industries for the current business
      responses:
        "200":
          description: List of selected industries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessIndustry"
    put:
      operationId: setBusinessIndustries
      tags: [account]
      summary: Replace all selected industries for the current business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetBusinessIndustriesInput"
      responses:
        "200":
          description: Updated list of industries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessIndustry"

  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List services
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createService
      tags: [services]
      summary: Create a service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Created service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"

  /services/{id}:
    patch:
      operationId: updateService
      tags: [services]
      summary: Update a service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdate"
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
    delete:
      operationId: deleteService
      tags: [services]
      summary: Delete a service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /pricing:
    get:
      operationId: getPricing
      tags: [pricing]
      summary: Get pricing rules
      responses:
        "200":
          description: Pricing rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingRules"
    put:
      operationId: savePricing
      tags: [pricing]
      summary: Create or update pricing rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingRulesInput"
      responses:
        "200":
          description: Saved pricing rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingRules"

  /invoice-settings:
    get:
      operationId: getInvoiceSettings
      tags: [invoiceSettings]
      summary: Get invoice formatting settings
      responses:
        "200":
          description: Invoice settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceSettings"
    put:
      operationId: saveInvoiceSettings
      tags: [invoiceSettings]
      summary: Create or update invoice formatting settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceSettingsInput"
      responses:
        "200":
          description: Saved invoice settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceSettings"

  /requirements:
    get:
      operationId: listRequirements
      tags: [requirements]
      summary: List the requirements checklist
      responses:
        "200":
          description: Requirements checklist
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Requirement"

  /requirements/{id}:
    patch:
      operationId: updateRequirement
      tags: [requirements]
      summary: Update a requirement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementUpdate"
      responses:
        "200":
          description: Updated requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"

  /files:
    get:
      operationId: listFiles
      tags: [files]
      summary: List uploaded files
      responses:
        "200":
          description: Uploaded files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UploadedFile"
    post:
      operationId: uploadFile
      tags: [files]
      summary: Register an uploaded file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadedFileInput"
      responses:
        "201":
          description: Uploaded file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedFile"

  /files/{id}:
    delete:
      operationId: deleteFile
      tags: [files]
      summary: Delete an uploaded file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /files/scan:
    post:
      operationId: scanDocuments
      tags: [files]
      summary: Scan uploaded documents with BDA to extract business knowledge
      responses:
        "200":
          description: Extracted requirement values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExtractedValue"

  /extracted-values:
    get:
      operationId: listExtractedValues
      tags: [extracted]
      summary: List AI-extracted requirement values
      responses:
        "200":
          description: Extracted values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExtractedValue"

  /extracted-values/{id}:
    patch:
      operationId: updateExtractedValue
      tags: [extracted]
      summary: Manually override an extracted value
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractedValueUpdate"
      responses:
        "200":
          description: Updated extracted value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractedValue"

  /sandbox-tests:
    get:
      operationId: listSandboxTests
      tags: [sandbox]
      summary: List sandbox test history
      responses:
        "200":
          description: Sandbox tests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SandboxTest"
    post:
      operationId: runSandboxTest
      tags: [sandbox]
      summary: Start a new Test Agent conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SandboxTestInput"
      responses:
        "201":
          description: Sandbox test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxTest"

  /sandbox-tests/{id}/messages:
    post:
      operationId: sendSandboxMessage
      tags: [sandbox]
      summary: Send a follow-up message in a Test Agent conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SandboxMessageInput"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxTest"

  /sandbox-tests/{id}/send-email:
    post:
      operationId: sendSandboxTestEmail
      tags: [sandbox]
      summary: Send the test estimate email to the customer address
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Email send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendEmailResult"

  /sandbox-tests/{id}/feedback:
    post:
      operationId: saveSandboxFeedback
      tags: [sandbox]
      summary: Save feedback for a Test Agent conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SandboxFeedbackInput"
      responses:
        "200":
          description: Updated sandbox test
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxTest"

  /business-profile-interview:
    get:
      operationId: getProfileInterview
      tags: [profileInterview]
      summary: Get (or start) the AI-guided business profile interview
      responses:
        "200":
          description: Interview state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileInterview"

  /business-profile-interview/message:
    post:
      operationId: sendProfileInterviewMessage
      tags: [profileInterview]
      summary: Send an owner message in the business profile interview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInterviewMessageInput"
      responses:
        "200":
          description: Updated interview state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileInterview"

  /business-profile-interview/confirm:
    post:
      operationId: confirmProfileInterview
      tags: [profileInterview]
      summary: Confirm the captured business profile and complete the step
      responses:
        "200":
          description: Confirmed interview state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileInterview"

  /business-profile-interview/reset:
    post:
      operationId: resetProfileInterview
      tags: [profileInterview]
      summary: Restart the business profile interview from scratch
      responses:
        "200":
          description: Reset interview state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileInterview"

  /business-profile-interview/structured:
    patch:
      operationId: saveStructuredProfileData
      tags: [profileInterview]
      summary: Save structured form fields into the interview profile data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StructuredProfileInput"
      responses:
        "200":
          description: Updated interview state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileInterview"

  /business-profile-interview/accept-policy:
    post:
      operationId: acceptPolicyDraft
      tags: [profileInterview]
      summary: Accept (or save an edited version of) a BDA-generated policy draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptPolicyInput"
      responses:
        "200":
          description: Updated interview state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileInterview"

  /business/operations:
    get:
      operationId: getBusinessOperations
      tags: [businessOperations]
      summary: Get company operations data
      responses:
        "200":
          description: Operations data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessOperations"
    patch:
      operationId: saveBusinessOperations
      tags: [businessOperations]
      summary: Save company operations data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessOperationsInput"
      responses:
        "200":
          description: Saved operations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessOperations"

  /business/policies:
    get:
      operationId: getBusinessPolicies
      tags: [businessPolicies]
      summary: Get business policies
      responses:
        "200":
          description: Policies data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessPolicies"
    patch:
      operationId: saveBusinessPolicies
      tags: [businessPolicies]
      summary: Save business policies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessPoliciesInput"
      responses:
        "200":
          description: Saved policies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessPolicies"

  /business/policies/ai-draft:
    post:
      operationId: aiDraftPolicy
      tags: [businessPolicies]
      summary: AI-generate a draft for a single policy field
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiDraftPolicyInput"
      responses:
        "200":
          description: AI-generated policy wording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiDraftPolicyResult"

  /assistant/chat:
    post:
      operationId: assistantChat
      tags: [assistant]
      summary: Chat with the in-app AI assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantChatInput"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantChatResult"

  /agent-preferences:
    get:
      operationId: getAgentPreferences
      tags: [agentPreferences]
      summary: Get agent preferences for the current business
      responses:
        "200":
          description: Agent preferences (all-null sections if never generated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPreferences"
    put:
      operationId: saveAgentPreferences
      tags: [agentPreferences]
      summary: Save edited agent preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentPreferencesInput"
      responses:
        "200":
          description: Saved agent preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPreferences"

  /agent-preferences/generate:
    post:
      operationId: generateAgentPreferences
      tags: [agentPreferences]
      summary: Generate agent preferences from setup data and test agent history
      responses:
        "200":
          description: Generated agent preferences (not yet confirmed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPreferences"

  /agent-preferences/confirm:
    post:
      operationId: confirmAgentPreferences
      tags: [agentPreferences]
      summary: Confirm agent preferences and mark the widget ready
      responses:
        "200":
          description: Confirmed agent preferences with updated business flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmAgentPreferencesResult"

  /business/estimate-rules:
    get:
      operationId: getEstimateRules
      tags: [estimateRules]
      summary: Get estimate rules
      responses:
        "200":
          description: Estimate rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimateRules"
    patch:
      operationId: saveEstimateRules
      tags: [estimateRules]
      summary: Save estimate rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateRulesInput"
      responses:
        "200":
          description: Saved estimate rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimateRules"

  /business/tone:
    get:
      operationId: getBusinessTone
      tags: [businessTone]
      summary: Get business tone settings
      responses:
        "200":
          description: Tone settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessTone"
    patch:
      operationId: saveBusinessTone
      tags: [businessTone]
      summary: Save business tone settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessToneInput"
      responses:
        "200":
          description: Saved tone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessTone"

  /business/profile/confirm:
    post:
      operationId: confirmBusinessProfile
      tags: [account]
      summary: Confirm the structured business profile and mark it complete
      responses:
        "200":
          description: Confirmed business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"

  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List leads
      responses:
        "200":
          description: Leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"

  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get lead detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDetail"
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update a lead status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdate"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /leads/{id}/send-email:
    post:
      operationId: sendLeadEmail
      tags: [leads]
      summary: Re-send the estimate email for a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Email send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendEmailResult"

  /widget-settings:
    get:
      operationId: getWidgetSettings
      tags: [widget]
      summary: Get widget settings
      responses:
        "200":
          description: Widget settings
          content:
            application/json:
              schema:
