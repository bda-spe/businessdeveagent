      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WidgetTestQuestionsInput"
      responses:
        "200":
          description: Industry-specific follow-up questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetQuestionsResult"

  /widget-test/interact:
    post:
      operationId: widgetTestInteract
