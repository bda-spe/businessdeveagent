components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Account:
      type: object
      required: [user, onboardingComplete, setupProgress]
      properties:
        user:
          $ref: "#/components/schemas/User"
        business:
          oneOf:
            - $ref: "#/components/schemas/Business"
            - type: "null"
        onboardingComplete:
          type: boolean
        setupProgress:
          $ref: "#/components/schemas/SetupProgress"

    SetupProgress:
      type: object
      required: [businessProfile, services, pricing, invoiceFormatting, widget, widgetStyled, testAgent]
      properties:
        businessProfile:
          type: boolean
        services:
          type: boolean
        pricing:
          type: boolean
        invoiceFormatting:
          type: boolean
        widget:
          type: boolean
        widgetStyled:
          type: boolean
          description: True once the business has saved widget styling at least once, regardless of whether the agent has been confirmed yet.
        testAgent:
          type: boolean

    User:
      type: object
      required: [id, email, ownerName]
      properties:
        id:
          type: integer
        email:
          type: string
        ownerName:
          type: string

    BusinessIndustry:
      type: object
      required: [id, businessId, industryCategory, industryName, isPrimary, createdAt]
      properties:
        id:
          type: integer
